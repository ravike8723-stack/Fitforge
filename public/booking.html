<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Personal Training &amp; Consultation | FitForge</title>
  <meta name="description" content="Schedule your FitForge personal training session, online coaching kickoff, or free 1-on-1 fitness consultation with Coach Alex." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Top Navigation -->
  <div class="nav-wrapper">
    <nav class="nav-bar" aria-label="Booking Navigation">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-main" data-brand="name">FITFORGE</span>
        <span class="nav-logo-sub" data-brand="subtitle">PERSONAL TRAINING &amp; COACHING</span>
      </a>
      <div class="nav-actions">
        <a href="dashboard.html" class="btn btn-glass btn-sm">Client Portal</a>
        <a href="index.html" class="btn btn-primary btn-sm">← Back to Website</a>
      </div>
    </nav>
  </div>

  <main class="container" style="padding-top: 8.5rem; padding-bottom: 5rem; max-width: 880px;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <span class="eyebrow">Interactive Coaching Calendar</span>
      <h1 style="font-size: clamp(2.4rem, 4vw, 3.4rem);">Book Your Coaching Session</h1>
      <p>Select your program, training format, preferred date, and time window below.</p>
    </div>

    <div class="glass-card" style="padding: 2.8rem;">
      <div class="step-indicator-bar" aria-label="Booking Progress">
        <div class="step-dot active" id="pageDot1">1</div>
        <div class="step-dot" id="pageDot2">2</div>
        <div class="step-dot" id="pageDot3">3</div>
        <div class="step-dot" id="pageDot4">4</div>
        <div class="step-dot" id="pageDot5">5</div>
        <div class="step-dot" id="pageDot6">6</div>
      </div>

      <div id="standaloneBookingMount"></div>
    </div>
  </main>

  <script src="js/siteContent.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bookingService.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
